    <!-- Small screens: a bar that follows the reader while no App Store button is on screen (site.js). -->
    <div class="sticky-cta" data-sticky-cta hidden>
      <img src="/img/app-icon.webp" alt="" width="40" height="40" loading="lazy" decoding="async" />
      <p><strong>{{header.app_name}}</strong><span>{{sticky.text}}</span></p>
      <a class="sticky-cta-button" href="{{store.sticky|attr}}" target="_blank" rel="noopener noreferrer" aria-label="{{header.download_aria_label}}">{{sticky.button}}</a>
    </div>
