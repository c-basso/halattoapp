<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="plastic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6d6"/>
      <stop offset="0.5" stop-color="#93cdb7"/>
      <stop offset="1" stop-color="#6aa891"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.2"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.88" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="barrelSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1b1a"/>
      <stop offset="0.35" stop-color="#4a4844"/>
      <stop offset="1" stop-color="#151413"/>
    </linearGradient>
    <radialGradient id="barrel" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0.55" stop-color="#2a2927"/>
      <stop offset="1" stop-color="#111110"/>
    </radialGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#8fb0de"/>
      <stop offset="0.45" stop-color="#34407a"/>
      <stop offset="0.8" stop-color="#7b3c74"/>
      <stop offset="1" stop-color="#1b1830"/>
    </radialGradient>
    <linearGradient id="finder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d8ea8"/>
      <stop offset="0.5" stop-color="#262d3c"/>
      <stop offset="1" stop-color="#12151d"/>
    </linearGradient>
    <linearGradient id="lever" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c978c"/>
      <stop offset="0.35" stop-color="#f7f4ec"/>
      <stop offset="1" stop-color="#8a857b"/>
    </linearGradient>
  </defs>

  <!-- body -->
  <rect x="44" y="64" width="424" height="392" rx="70" fill="url(#plastic)"/>
  <rect x="44" y="64" width="424" height="392" rx="70" fill="url(#sheen)"/>
  <rect x="96" y="72" width="320" height="8" rx="4" fill="#fff" fill-opacity="0.5"/>
  <rect x="46" y="66" width="420" height="388" rx="68" fill="none" stroke="#3f6f5e" stroke-opacity="0.45" stroke-width="4"/>

  <!-- viewfinder and shutter lever -->
  <rect x="84" y="100" width="72" height="54" rx="12" fill="url(#finder)"/>
  <rect x="92" y="106" width="28" height="8" rx="4" fill="#fff" fill-opacity="0.35"/>
  <rect x="392" y="150" width="44" height="22" rx="8" fill="url(#lever)"/>

  <!-- big protruding plastic lens -->
  <circle cx="256" cy="290" r="150" fill="url(#barrelSide)"/>
  <circle cx="256" cy="290" r="134" fill="url(#barrel)"/>
  <circle cx="256" cy="290" r="134" fill="none" stroke="#5c5954" stroke-width="6"/>
  <circle cx="256" cy="290" r="104" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="5"/>
  <circle cx="256" cy="290" r="62" fill="url(#glass)"/>
  <circle cx="256" cy="290" r="62" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="6"/>
  <ellipse cx="234" cy="266" rx="20" ry="13" fill="#fff" fill-opacity="0.75" transform="rotate(-30 234 266)"/>
</svg>
