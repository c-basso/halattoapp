<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="136" x2="0" y2="388">
      <stop offset="0" stop-color="#8fb5e8"/>
      <stop offset="0.5" stop-color="#3f73c2"/>
      <stop offset="1" stop-color="#1f3f7a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="0.1" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="0.9" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#232220"/>
      <stop offset="0.45" stop-color="#4a4844"/>
      <stop offset="1" stop-color="#2a2927"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fc"/>
      <stop offset="0.5" stop-color="#b9c6d6"/>
      <stop offset="1" stop-color="#6f7f94"/>
    </linearGradient>
    <radialGradient id="barrel" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0.55" stop-color="#2a2a2c"/>
      <stop offset="1" stop-color="#0f0f10"/>
    </radialGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="0.5" stop-color="#2c5fae"/>
      <stop offset="1" stop-color="#0c1838"/>
    </radialGradient>
    <linearGradient id="flash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#b9c4cf"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c9ea1"/>
      <stop offset="0.35" stop-color="#f7f8f9"/>
      <stop offset="1" stop-color="#85888c"/>
    </linearGradient>
  </defs>

  <!-- shutter button -->
  <rect x="268" y="116" width="74" height="26" rx="10" fill="url(#button)"/>

  <!-- body -->
  <rect x="20" y="136" width="472" height="252" rx="40" fill="url(#body)"/>
  <rect x="20" y="136" width="472" height="252" rx="40" fill="url(#sheen)"/>
  
  <rect x="60" y="144" width="392" height="7" rx="3.5" fill="#fff" fill-opacity="0.55"/>
  <rect x="22" y="138" width="468" height="248" rx="38" fill="none" stroke="#1b3566" stroke-opacity="0.6" stroke-width="4"/>

  <!-- flash and AF-assist light -->
  <rect x="58" y="170" width="96" height="40" rx="10" fill="url(#flash)"/>
  <rect x="58" y="170" width="96" height="40" rx="10" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="4"/>
  <circle cx="90" cy="248" r="13" fill="#e8873c"/>

  <!-- flat retracting lens -->
  <circle cx="318" cy="268.0" r="104" fill="#1a1a1b"/>
  <circle cx="318" cy="268.0" r="96" fill="url(#ring)"/>
  <circle cx="318" cy="268.0" r="76.80000000000001" fill="url(#barrel)"/>
  <circle cx="318" cy="268.0" r="46.08" fill="url(#glass)"/>
  <circle cx="318" cy="268.0" r="46.08" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="5"/>
  <ellipse cx="298.8" cy="246.88" rx="16.32" ry="10.56" fill="#fff" fill-opacity="0.75" transform="rotate(-30 298.8 246.88)"/>
</svg>
