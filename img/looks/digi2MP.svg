<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="112" x2="0" y2="412">
      <stop offset="0" stop-color="#c9c7c2"/>
      <stop offset="0.5" stop-color="#9d9a94"/>
      <stop offset="1" stop-color="#6e6b66"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="0.1" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="0.9" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#232220"/>
      <stop offset="0.45" stop-color="#4a4844"/>
      <stop offset="1" stop-color="#2a2927"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3936"/>
      <stop offset="0.5" stop-color="#2a2927"/>
      <stop offset="1" stop-color="#1a1918"/>
    </linearGradient>
    <radialGradient id="barrel" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0.55" stop-color="#2a2a2c"/>
      <stop offset="1" stop-color="#0f0f10"/>
    </radialGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#a9c3d9"/>
      <stop offset="0.5" stop-color="#3d4e6e"/>
      <stop offset="1" stop-color="#121826"/>
    </radialGradient>
    <linearGradient id="flash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#b9c4cf"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c9ea1"/>
      <stop offset="0.35" stop-color="#f7f8f9"/>
      <stop offset="1" stop-color="#85888c"/>
    </linearGradient>
  </defs>

  <!-- shutter button -->
  <rect x="272" y="92" width="74" height="26" rx="10" fill="url(#button)"/>

  <!-- body -->
  <rect x="20" y="112" width="472" height="300" rx="30" fill="url(#body)"/>
  <rect x="20" y="112" width="472" height="300" rx="30" fill="url(#sheen)"/>
  <rect x="20" y="112" width="112" height="300" rx="30" fill="url(#grip)"/><rect x="126" y="130" width="6" height="264" rx="3" fill="#fff" fill-opacity="0.25"/><rect x="44" y="172" width="60" height="6" rx="3" fill="#000" fill-opacity="0.25"/><rect x="44" y="198" width="60" height="6" rx="3" fill="#000" fill-opacity="0.25"/><rect x="44" y="224" width="60" height="6" rx="3" fill="#000" fill-opacity="0.25"/><rect x="44" y="250" width="60" height="6" rx="3" fill="#000" fill-opacity="0.25"/><rect x="44" y="276" width="60" height="6" rx="3" fill="#000" fill-opacity="0.25"/><rect x="44" y="302" width="60" height="6" rx="3" fill="#000" fill-opacity="0.25"/><rect x="44" y="328" width="60" height="6" rx="3" fill="#000" fill-opacity="0.25"/><rect x="44" y="354" width="60" height="6" rx="3" fill="#000" fill-opacity="0.25"/>
  <rect x="150" y="120" width="312" height="7" rx="3.5" fill="#fff" fill-opacity="0.55"/>
  <rect x="22" y="114" width="468" height="296" rx="28" fill="none" stroke="#4f4c48" stroke-opacity="0.6" stroke-width="4"/>

  <!-- flash and AF-assist light -->
  <rect x="156" y="146" width="96" height="40" rx="10" fill="url(#flash)"/>
  <rect x="156" y="146" width="96" height="40" rx="10" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="4"/>
  <circle cx="186" cy="224" r="13" fill="#e8873c"/>

  <!-- flat retracting lens -->
  <circle cx="322" cy="268.0" r="90" fill="#1a1a1b"/>
  <circle cx="322" cy="268.0" r="82" fill="url(#ring)"/>
  <circle cx="322" cy="268.0" r="65.60000000000001" fill="url(#barrel)"/>
  <circle cx="322" cy="268.0" r="39.36" fill="url(#glass)"/>
  <circle cx="322" cy="268.0" r="39.36" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="5"/>
  <ellipse cx="305.6" cy="249.96" rx="13.940000000000001" ry="9.02" fill="#fff" fill-opacity="0.75" transform="rotate(-30 305.6 249.96)"/>
</svg>
