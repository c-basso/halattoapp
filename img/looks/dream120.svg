<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="plastic" gradientUnits="userSpaceOnUse" x1="0" y1="66" x2="0" y2="430">
      <stop offset="0" stop-color="#f6cfd6"/>
      <stop offset="0.5" stop-color="#e3a5b3"/>
      <stop offset="1" stop-color="#c07a8c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.88" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf3ef"/>
      <stop offset="1" stop-color="#cdb9b6"/>
    </linearGradient>
    <radialGradient id="barrel" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0.55" stop-color="#2d2a2c"/>
      <stop offset="1" stop-color="#131213"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#ff9ec4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff9ec4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#f3d6f2"/>
      <stop offset="0.4" stop-color="#a77bc9"/>
      <stop offset="0.8" stop-color="#5a3c8a"/>
      <stop offset="1" stop-color="#21173a"/>
    </radialGradient>
    <linearGradient id="finder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e8fb0"/>
      <stop offset="0.5" stop-color="#2b2b40"/>
      <stop offset="1" stop-color="#15151f"/>
    </linearGradient>
  </defs>

  <!-- raised viewfinder hump -->
  <rect x="176" y="66" width="160" height="90" rx="30" fill="url(#plastic)"/>
  <rect x="176" y="66" width="160" height="90" rx="30" fill="url(#sheen)"/>
  <rect x="220" y="86" width="72" height="44" rx="12" fill="url(#finder)"/>
  <rect x="228" y="92" width="26" height="7" rx="3.5" fill="#fff" fill-opacity="0.35"/>

  <!-- body -->
  <rect x="20" y="128" width="472" height="302" rx="64" fill="url(#plastic)"/>
  <rect x="20" y="128" width="472" height="302" rx="64" fill="url(#sheen)"/>
  <rect x="80" y="136" width="352" height="8" rx="4" fill="#fff" fill-opacity="0.5"/>
  <rect x="22" y="130" width="468" height="298" rx="62" fill="none" stroke="#8e4f62" stroke-opacity="0.45" stroke-width="4"/>

  <!-- stepped lens with a soft glow -->
  <circle cx="256" cy="290" r="128" fill="url(#step)"/>
  <circle cx="256" cy="290" r="128" fill="none" stroke="#8e4f62" stroke-opacity="0.5" stroke-width="4"/>
  <circle cx="256" cy="290" r="104" fill="url(#barrel)"/>
  <circle cx="256" cy="290" r="84" fill="url(#glow)"/>
  <circle cx="256" cy="290" r="54" fill="url(#glass)"/>
  <circle cx="256" cy="290" r="54" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="5"/>
  <ellipse cx="238" cy="268" rx="17" ry="11" fill="#fff" fill-opacity="0.8" transform="rotate(-30 238 268)"/>
</svg>
