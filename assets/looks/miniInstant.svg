<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#e4ddcf"/>
    </linearGradient>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="0" y2="282">
      <stop offset="0" stop-color="#1f6fd1"/>
      <stop offset="1" stop-color="#9fdcf5"/>
    </linearGradient>
    <linearGradient id="sea" gradientUnits="userSpaceOnUse" x1="0" y1="262" x2="0" y2="330">
      <stop offset="0" stop-color="#16a7c4"/>
      <stop offset="1" stop-color="#0b5f9a"/>
    </linearGradient>
    <linearGradient id="sand" gradientUnits="userSpaceOnUse" x1="0" y1="322" x2="0" y2="372">
      <stop offset="0" stop-color="#f5e7c4"/>
      <stop offset="1" stop-color="#dcc28e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="rotate(-5 256 256)">
    <!-- soft shadow under the card -->
    <rect x="132" y="44" width="264" height="434" rx="18" fill="#000" fill-opacity="0.12"/>

    <!-- narrow card -->
    <rect x="124" y="34" width="264" height="434" rx="16" fill="url(#card)"/>
    <rect x="124" y="34" width="264" height="434" rx="16" fill="none" stroke="#b9b09f" stroke-width="4"/>

    <!-- portrait picture -->
    <rect x="146" y="64" width="220" height="308" rx="4" fill="url(#sky)"/>
    <circle cx="300" cy="150" r="46" fill="url(#sun)"/>
    <rect x="146" y="262" width="220" height="80" fill="url(#sea)"/>
    <rect x="176" y="280" width="70" height="7" rx="3.5" fill="#fff" fill-opacity="0.55"/>
    <path d="M146 334 C210 318 290 318 366 330 V372 H146 Z" fill="url(#sand)"/>
    <rect x="146" y="64" width="220" height="308" rx="4" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="3"/>
  </g>
</svg>
