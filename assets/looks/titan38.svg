<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece5d6"/>
      <stop offset="0.45" stop-color="#d3c9b5"/>
      <stop offset="1" stop-color="#a99e88"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="0.88" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c937f"/>
      <stop offset="0.35" stop-color="#f4efe4"/>
      <stop offset="1" stop-color="#8d846f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f0"/>
      <stop offset="0.5" stop-color="#cfc6b3"/>
      <stop offset="1" stop-color="#8f8672"/>
    </linearGradient>
    <radialGradient id="barrel" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0.6" stop-color="#2b2a28"/>
      <stop offset="1" stop-color="#121211"/>
    </radialGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#6d8fd0"/>
      <stop offset="0.45" stop-color="#34407a"/>
      <stop offset="0.8" stop-color="#7b3c74"/>
      <stop offset="1" stop-color="#1b1830"/>
    </radialGradient>
    <linearGradient id="finder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d7397"/>
      <stop offset="0.5" stop-color="#232c3f"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <linearGradient id="flash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#b9c4cf"/>
    </linearGradient>
  </defs>

  <!-- shutter button -->
  <rect x="356" y="86" width="64" height="30" rx="10" fill="url(#button)"/>

  <!-- body -->
  <rect x="20" y="106" width="472" height="324" rx="60" fill="url(#body)"/>
  <rect x="20" y="106" width="472" height="324" rx="60" fill="url(#sheen)"/>
  <rect x="50" y="114" width="412" height="8" rx="4" fill="#fff" fill-opacity="0.6"/>

  <!-- viewfinder and flash -->
  <rect x="62" y="150" width="78" height="54" rx="12" fill="url(#finder)"/>
  <rect x="70" y="156" width="30" height="8" rx="4" fill="#fff" fill-opacity="0.35"/>
  <rect x="380" y="150" width="74" height="54" rx="12" fill="url(#flash)"/>
  <rect x="380" y="150" width="74" height="54" rx="12" fill="none" stroke="#8f8672" stroke-width="4"/>

  <!-- lens -->
  <circle cx="262" cy="282" r="132" fill="#7a715f"/>
  <circle cx="262" cy="282" r="127" fill="url(#ring)"/>
  <circle cx="262" cy="282" r="104" fill="url(#barrel)"/>
  <circle cx="262" cy="282" r="66" fill="url(#glass)"/>
  <circle cx="262" cy="282" r="66" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="6"/>
  <ellipse cx="238" cy="256" rx="22" ry="14" fill="#fff" fill-opacity="0.75" transform="rotate(-30 238 256)"/>

</svg>
