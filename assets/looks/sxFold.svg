<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#e4ddcf"/>
    </linearGradient>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="96" x2="0" y2="326">
      <stop offset="0" stop-color="#1f2a55"/>
      <stop offset="0.55" stop-color="#6c5f9e"/>
      <stop offset="1" stop-color="#d9b8dc"/>
    </linearGradient>
    <linearGradient id="water" gradientUnits="userSpaceOnUse" x1="0" y1="268" x2="0" y2="356">
      <stop offset="0" stop-color="#3c3f78"/>
      <stop offset="1" stop-color="#141b38"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.5" stop-color="#fbeaf3"/>
      <stop offset="0.7" stop-color="#e9bfe0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#e9bfe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="rotate(-6 256 256)">
    <!-- soft shadow under the card -->
    <rect x="98" y="58" width="332" height="420" rx="18" fill="#000" fill-opacity="0.12"/>

    <!-- card with the wide bottom border -->
    <rect x="90" y="48" width="332" height="420" rx="16" fill="url(#card)"/>
    <rect x="90" y="48" width="332" height="420" rx="16" fill="none" stroke="#b9b09f" stroke-width="4"/>

    <!-- picture -->
    <rect x="118" y="76" width="276" height="276" rx="4" fill="url(#sky)"/>
    <circle cx="256" cy="232" r="70" fill="url(#sun)"/>
    <rect x="118" y="268" width="276" height="84" fill="url(#water)"/>
    <rect x="206" y="286" width="100" height="8" rx="4" fill="#e9c9e6" fill-opacity="0.75"/>
    <rect x="226" y="306" width="60" height="7" rx="3.5" fill="#e9c9e6" fill-opacity="0.5"/>
    <rect x="118" y="76" width="276" height="276" rx="4" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="3"/>
  </g>
</svg>
