<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#e4ddcf"/>
    </linearGradient>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="96" x2="0" y2="326">
      <stop offset="0" stop-color="#9fc4b4"/>
      <stop offset="0.55" stop-color="#e9b9bf"/>
      <stop offset="1" stop-color="#f6d9cf"/>
    </linearGradient>
    <linearGradient id="water" gradientUnits="userSpaceOnUse" x1="0" y1="268" x2="0" y2="356">
      <stop offset="0" stop-color="#5f8f6c"/>
      <stop offset="1" stop-color="#2f5a45"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.5" stop-color="#fff3ea"/>
      <stop offset="0.7" stop-color="#f4c3c3" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f4c3c3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="rotate(5 256 256)">
    <!-- soft shadow under the card -->
    <rect x="98" y="58" width="332" height="420" rx="18" fill="#000" fill-opacity="0.12"/>

    <!-- card with the wide bottom border -->
    <rect x="90" y="48" width="332" height="420" rx="16" fill="url(#card)"/>
    <rect x="90" y="48" width="332" height="420" rx="16" fill="none" stroke="#b9b09f" stroke-width="4"/>

    <!-- picture -->
    <rect x="118" y="76" width="276" height="276" rx="4" fill="url(#sky)"/>
    <circle cx="256" cy="232" r="70" fill="url(#sun)"/>
    <path d="M118 290 C170 240 230 250 280 282 C320 262 360 254 394 266 V352 H118 Z" fill="url(#water)"/>
    <path d="M118 322 C190 292 300 300 394 320 V352 H118 Z" fill="#244a38" fill-opacity="0.85"/>
    <rect x="118" y="76" width="276" height="276" rx="4" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="3"/>
  </g>
</svg>
