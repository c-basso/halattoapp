<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55524d"/>
      <stop offset="0.5" stop-color="#3a3835"/>
      <stop offset="1" stop-color="#262523"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.3"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.07"/>
      <stop offset="0.88" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c978c"/>
      <stop offset="0.35" stop-color="#f7f4ec"/>
      <stop offset="1" stop-color="#8a857b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="0.5" stop-color="#d4cfc4"/>
      <stop offset="1" stop-color="#8f8a80"/>
    </linearGradient>
    <radialGradient id="barrel" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0.6" stop-color="#222120"/>
      <stop offset="1" stop-color="#0d0d0c"/>
    </radialGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#b9bcc0"/>
      <stop offset="0.45" stop-color="#5c5f64"/>
      <stop offset="0.85" stop-color="#2a2b2e"/>
      <stop offset="1" stop-color="#121214"/>
    </radialGradient>
    <linearGradient id="finder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a96a8"/>
      <stop offset="0.5" stop-color="#2b3140"/>
      <stop offset="1" stop-color="#14171f"/>
    </linearGradient>
    <linearGradient id="flash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#b9c4cf"/>
    </linearGradient>
  </defs>

  <!-- shutter button -->
  <rect x="84" y="100" width="72" height="28" rx="10" fill="url(#button)"/>

  <!-- body -->
  <rect x="20" y="118" width="472" height="300" rx="86" fill="url(#body)"/>
  <rect x="20" y="118" width="472" height="300" rx="86" fill="url(#sheen)"/>
  <rect x="22" y="120" width="468" height="296" rx="84" fill="none" stroke="#a49e92" stroke-opacity="0.7" stroke-width="4"/>
  <rect x="84" y="126" width="344" height="7" rx="3.5" fill="#fff" fill-opacity="0.22"/>

  <!-- flash and viewfinder -->
  <rect x="70" y="176" width="92" height="46" rx="12" fill="url(#flash)"/>
  <rect x="70" y="176" width="92" height="46" rx="12" fill="none" stroke="#121211" stroke-opacity="0.5" stroke-width="4"/>
  <rect x="80" y="256" width="64" height="46" rx="12" fill="url(#finder)"/>
  <rect x="88" y="262" width="26" height="7" rx="3.5" fill="#fff" fill-opacity="0.35"/>

  <!-- lens -->
  <circle cx="312" cy="268" r="128" fill="#1a1918"/>
  <circle cx="312" cy="268" r="122" fill="url(#ring)"/>
  <circle cx="312" cy="268" r="102" fill="url(#barrel)"/>
  <circle cx="312" cy="268" r="62" fill="url(#glass)"/>
  <circle cx="312" cy="268" r="62" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="6"/>
  <ellipse cx="290" cy="244" rx="20" ry="13" fill="#fff" fill-opacity="0.75" transform="rotate(-30 290 244)"/>
</svg>
